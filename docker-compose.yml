# Явное имя: иначе из пути с кириллицей Compose может получить пустое имя проекта
# и выдать: "project name must not be empty"
name: passapp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passapp
      POSTGRES_PASSWORD: passapp
      POSTGRES_DB: passapp
    ports:
      - "5433:5432"
    volumes:
      - passapp_pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://passapp:passapp@db:5432/passapp
      JWT_SECRET: change-me-in-production-min-32-chars-long
      CLIENT_ORIGIN: http://localhost:4000
    depends_on:
      - db

volumes:
  passapp_pgdata:
